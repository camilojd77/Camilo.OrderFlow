name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restore uses the lock file when present; Central Package Management
      # means all versions are already pinned in Directory.Packages.props.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration ${{ env.BUILD_CONFIGURATION }}
          /p:TreatWarningsAsErrors=true

      # xunit.v3 corre sobre Microsoft Testing Platform (el runner esta declarado en
      # global.json). Los argumentos despues de `--` van a la app de test, no al SDK:
      # reemplazan a --logger trx y a --collect:"XPlat Code Coverage" de VSTest.
      # Sin filtro: el runner de GitHub trae Docker, asi que tambien corre la suite RealDb.
      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --results-directory ./test-results
          --
          --report-trx
          --coverage
          --coverage-output-format cobertura

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: test-results/**/*.cobertura.xml
          retention-days: 7

