name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # SDK fijado en global.json (docs/adr/0024-versiones-fijadas-sdk-imagenes-y-acciones.md)
          global-json-file: global.json

      # Restore uses the lock file when present; Central Package Management
      # means all versions are already pinned in Directory.Packages.props.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          --configuration ${{ env.BUILD_CONFIGURATION }}
          /p:TreatWarningsAsErrors=true

      # xunit.v3 corre sobre Microsoft Testing Platform (el runner esta declarado en
      # global.json). Los argumentos despues de `--` van a la app de test, no al SDK:
      # reemplazan a --logger trx y a --collect:"XPlat Code Coverage" de VSTest.
      # Sin filtro: el runner de GitHub trae Docker, asi que tambien corre la suite RealDb.
      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --results-directory ./test-results
          --
          --report-trx
          --coverage
          --coverage-output-format cobertura

      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: Test Results
          path: test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: test-results/**/*.cobertura.xml
          retention-days: 7

