# OpenTelemetry Collector – local dev configuration
# Receives OTLP from the .NET API, fans out to Tempo (traces) and Prometheus (metrics).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Forward traces to Tempo via OTLP gRPC (internal Docker network)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Expose scraped metrics on :8889 so Prometheus can pull them
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 180m

service:
  # Expose collector's own internal metrics on :8888
  telemetry:
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]