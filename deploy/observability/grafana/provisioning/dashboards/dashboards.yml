apiVersion: 1

# Dashboards as code: Grafana loads every JSON in /var/lib/grafana/dashboards (mounted read-only from
# deploy/observability/grafana/dashboards). Changes are made in the repository, not in the UI.
providers:
  - name: camilo-order-flow
    folder: Camilo.OrderFlow
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
