global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Application metrics exported via OTel Collector's Prometheus exporter
  - job_name: otel-collector-metrics
    static_configs:
      - targets:
          - otel-collector:8889

  # OTel Collector's own internal telemetry (queue size, dropped spans, etc.)
  - job_name: otel-collector-internal
    static_configs:
      - targets:
          - otel-collector:8888
